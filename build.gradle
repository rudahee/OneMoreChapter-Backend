plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.rudahee'
version = '0.0.1-SNAPSHOT'
description = 'UnCapituloMasBackend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

// Lombok necesita estar tambien en compileOnly, no solo como procesador.
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Solo las versiones que NO gobierna el BOM de Spring Boot. El resto
// (MariaDB, Flyway, Hibernate, Testcontainers, Lombok, Micrometer) las
// gestiona Boot: no las fijes a mano o acabas con incompatibilidades sutiles.
ext {
    springdocVersion = '3.1.1'   // la serie 3.x es la de Boot 4; la 2.x es de Boot 3
    bucket4jVersion  = '8.19.0'
    wiremockVersion  = '3.13.1'  // comprueba la ultima antes de fijarla
}

ext {
    springdocVersion    = '3.1.1'
    bucket4jVersion     = '8.19.0'
    bouncyCastleVersion = '1.82'
}

dependencies {

    // --- Web ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // --- Seguridad ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Argon2PasswordEncoder delega en BouncyCastle. El BOM de Boot 4 no
    // gestiona su version, hay que fijarla.
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"

    // --- Persistencia ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // En Boot 4 la autoconfiguracion de Flyway vive en su propio modulo:
    // con flyway-core a secas, spring.flyway.* se ignora en silencio.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // --- Cache de metadatos ---
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- Observabilidad ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // --- Rate limiting de proveedores externos ---
    implementation "com.bucket4j:bucket4j_jdk17-core:${bucket4jVersion}"

    // --- Documentacion de la API ---
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // --- Procesadores de anotaciones ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Los tests de integracion levantan contenedores; en el primer arranque
    // los timeouts por defecto se quedan cortos.
    systemProperty 'junit.jupiter.execution.timeout.default', '5m'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']
}

tasks.named('bootJar') {
    archiveFileName = 'uncapitulomas.jar'
}